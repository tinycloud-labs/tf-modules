name: TF Lint

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - 'proxmox/**'

jobs:
  code-lint:
    runs-on: ubuntu-latest
    if: github.event.pull_request.state == 'open'
    container:
      image: ghcr.io/tinycloud-labs/tf-tools:latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - run: |
          echo "workspace: ${{ github.workspace }}"
          pwd
          git rev-parse --show-toplevel
      - name: Run Git Setup
        uses: ./.github/actions/setup-git
        with:
          repo-path: ${{ github.workspace }}

      - name: TF Formatting
        run: terraform fmt -recursive

      - name: Lint TF modules
        run: tflint --recursive
        working-directory: ./proxmox

      - name: Commit changes
        run: |
          git add -A
          git commit -m "chore: auto-format Terraform files [skip ci]" || echo "No changes to commit"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git ${{ github.head_ref }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
